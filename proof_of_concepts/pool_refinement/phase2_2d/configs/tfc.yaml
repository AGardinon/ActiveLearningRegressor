# Styblinski-Tang 2D on [-4, 4]^2, negated (maximisation). Four corner basins:
# (-2.90, -2.90) 78.33 (global), the two mixed corners 64.20, (2.75, 2.75) 50.06.
# The pool has only 5 LHS points: refinement is the only way to add candidates.
function_parameters:
  bounds: [[-4.0, 4.0], [-4.0, 4.0]]
  custom: true
  function: StyblinskiTang
  n_dimensions: 2
train_set_parameters:
  method: lhs
  n_samples: 5
  negate: true
  noise_std: 0.0
  val_size: null
