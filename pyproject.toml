[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "activereg"
version = "0.1.0"
description = "Active learning framework for supervised regression problems."
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Andrea Gardin" }]
requires-python = ">=3.10"

dependencies = [
    "numpy",
    "pandas",
    "scipy",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "joblib",
    "pyyaml",
    "tqdm",
    "plotly",
]

[project.optional-dependencies]
# Neural-network models: MLP, AnchoredEnsembleMLP, BayesianNN.
nn = ["torch", "pyro-ppl"]
# Synthetic test functions and benchmark dataset generation
# (botorch depends on torch).
benchmarks = ["botorch"]
# UMAP projections in scripts/plot_visual_benchmark_experiment.py -dim_red umap.
viz = ["umap-learn"]
all = ["activereg[nn,benchmarks,viz]"]

[project.urls]
Repository = "https://github.com/AGardinon/ActiveLearningRegressor"

[tool.setuptools.packages.find]
where = ["."]
include = ["activereg*"]
